name: Build GoTr-Ail V9.9 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'GoTr_AI_9_7/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GoTr_AI_9_7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoTr-Ail-V9.9-debug-apk
          path: GoTr_AI_9_7/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
